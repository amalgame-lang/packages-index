license     = "Apache-2.0"
category    = "network"

[[package]]
name        = "net-smtp-server"
url         = "github.com/amalgame-lang/amalgame-net-smtp-server"
description = "Receiving ESMTP server for the native Amalgame mail server: SmtpSession state machine (EHLO/STARTTLS/AUTH PLAIN+LOGIN/MAIL/RCPT/DATA) + SmtpServer TCP/TLS accept loop, delivering into amalgame-net-mail-store. AUTH via scrypt (amalgame-crypto); receive-only (not an open relay)."
tier        = "official"
maintainer  = "amalgame-lang"
license     = "Apache-2.0"
category    = "network"

[[package]]
name        = "net-imap"
url         = "github.com/amalgame-lang/amalgame-net-imap"
description = "IMAP4rev1 server for the native Amalgame mail server: ImapSession state machine (CAPABILITY/STARTTLS/LOGIN/LIST/SELECT/FETCH+UID FETCH/STORE/SEARCH/EXPUNGE) + ImapServer TCP/TLS accept loop, reading an amalgame-net-mail-store. AUTH via scrypt (amalgame-crypto). Pairs with net-smtp-server."
tier        = "official"
maintainer  = "amalgame-lang"
license     = "Apache-2.0"
category    = "network"

[[package]]
name        = "net-pop3"
url         = "github.com/amalgame-lang/amalgame-net-pop3"
description = "POP3 server (RFC 1939 + STLS) for the native Amalgame mail server: Pop3Session state machine (USER/PASS/STAT/LIST/UIDL/RETR/TOP/DELE/QUIT) + Pop3Server TCP/TLS accept loop, reading an amalgame-net-mail-store. AUTH via scrypt (amalgame-crypto). Legacy companion to net-imap."
tier        = "official"
maintainer  = "amalgame-lang"
license     = "Apache-2.0"
category    = "network"

[[package]]
name        = "mail-dkim"
url         = "github.com/amalgame-lang/amalgame-mail-dkim"
description = "DKIM signing (RFC 6376, rsa-sha256, relaxed/relaxed) for the native Amalgame mail server: Dkim.Sign prepends a DKIM-Signature header (From/To/Subject/Date + body hash), Dkim.Verify checks it. Built on amalgame-crypto (Sha256 + JwsKey RS256). The DKIM pillar of SPF/DKIM/DMARC deliverability."
tier        = "official"
maintainer  = "amalgame-lang"
license     = "Apache-2.0"
category    = "network"

[[package]]
name        = "mail-send"
url         = "github.com/amalgame-lang/amalgame-mail-send"
description = "Outbound SMTP delivery (the send path) for the native Amalgame mail server: Sender.Send (plaintext + opportunistic STARTTLS, optional DKIM signing) + Sender.Deliver (MX lookup via Mx.Lookup, direct delivery to the recipient's best MX). To MX :25 / submission :587 / a smarthost. Complements the implicit-TLS amalgame-net-smtp client."
tier        = "official"
maintainer  = "amalgame-lang"
license     = "Apache-2.0"
category    = "network"

[[package]]
name        = "net-grpc"
url         = "github.com/amalgame-lang/amalgame-net-grpc"
description = "gRPC server for the Mosaic stack — message framing, status codes, method-path routing, unary dispatch, and GrpcServer.ServeH2c (serve gRPC over HTTP/2 cleartext end-to-end). Composes amalgame-formats-protobuf + amalgame-net-http."
tier        = "official"
maintainer  = "amalgame-lang"
license     = "Apache-2.0"
category    = "network"

